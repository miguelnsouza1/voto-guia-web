name: Publicar atualização do Voto Guia

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site publicado
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Baixar build validado
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-4440-820e-8329-8c72bd302598/raw?se=2026-08-17T12%3A19%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=cfccc33a-6021-559c-85f0-076d1f0c63ce&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T11%3A51%3A57Z&ske=2026-08-18T11%3A51%3A57Z&sks=b&skv=2026-02-06&sig=cQ8bKtl5wCr0pTeTB/kJvsUPnemqhrT%2B05MOTQfDzRk%3D'
        run: |
          curl -fL "$ARTIFACT_URL" -o /tmp/site.zip
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/site.zip -d /tmp/site

      - name: Publicar somente o site compilado
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/site/. .
          touch .nojekyll
          git config user.name "Voto Guia Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Atualizar Voto Guia: perfis públicos e redes" || exit 0
          git push origin HEAD:gh-pages
