<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#808080" />
<meta name="description" content="Voto Guia — candidatos, bens, trajetória e resultados eleitorais com dados públicos do TSE." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="/voto-guia-web/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/voto-guia-web/icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/voto-guia-web/icons/favicon-32.png" />
<title>Voto Guia</title>
<script>
(() => {
 let selectedMunicipalYear=null, internalYearClick=false;
 const originalFetch=window.fetch.bind(window);
 window.fetch=(input,init={})=>{
  try{
   let url=typeof input==='string'?input:input?.url||'';
   if(url.includes('/rest/v1/rpc/candidate_filter_options')&&selectedMunicipalYear){
    const body=init.body?JSON.parse(init.body):{}; body.p_year=selectedMunicipalYear; init={...init,body:JSON.stringify(body)};
   }
   if(url.includes('/rest/v1/candidate_catalog_public')){
    const p=new URL(url,location.origin);
    if(selectedMunicipalYear){
     p.searchParams.set('election_year',`eq.${selectedMunicipalYear}`);
     const office=p.searchParams.get('office_name')||'';
     if(!office||office.startsWith('in.(')||!['PREFEITO','VEREADOR'].includes(office.replace('eq.',''))) p.searchParams.set('office_name','in.(PREFEITO,VEREADOR)');
     const and=p.searchParams.get('and');
     if(and){
      let fixed=and.replace(/,?or\(uf\.eq\.[^,()]+,office_name\.eq\.PRESIDENTE\)/g,'');
      fixed=fixed.replace(/office_name\.eq\.(PRESIDENTE|GOVERNADOR|SENADOR|DEPUTADO FEDERAL|DEPUTADO ESTADUAL|DEPUTADO DISTRITAL),?/g,'');
      fixed=fixed.replace(/\(\s*,/g,'(').replace(/,\s*\)/g,')').replace(/,{2,}/g,',');
      if(!fixed || /^[\s(),]*$/.test(fixed) || /\(\s*\)/.test(fixed)) p.searchParams.delete('and');
      else p.searchParams.set('and',fixed);
     }
     url=p.toString(); input=typeof input==='string'?url:new Request(url,input);
    }
    const headers=new Headers(init.headers||(typeof input!=='string'?input?.headers:undefined));
    const prefer=headers.get('Prefer'); if(prefer&&/count=exact/i.test(prefer)){headers.set('Prefer',prefer.replace(/count=exact/ig,'count=planned'));init={...init,headers};}
   }
  }catch(_){}
  return originalFetch(input,init);
 };
 function setVisualYear(box,year){box.querySelectorAll('button').forEach(b=>{b.classList.remove('border-neutral-800','bg-neutral-800','text-white');b.classList.add('border-neutral-200','bg-white','text-neutral-700')});const a=[...box.querySelectorAll('button')].find(b=>b.textContent.trim().startsWith(String(year)));if(a){a.classList.remove('border-neutral-200','bg-white','text-neutral-700');a.classList.add('border-neutral-800','bg-neutral-800','text-white')}document.querySelectorAll('h1').forEach(h=>{if(/^Candidatos\s+20\d{2}$/.test(h.textContent.trim()))h.textContent=`Candidatos ${year}`})}
 function installYearButtons(){const label=[...document.querySelectorAll('div')].find(el=>el.textContent?.trim()==='Ano da eleição');if(!label)return;const box=label.parentElement?.querySelector('.flex.flex-wrap.gap-2');if(!box)return;[...box.querySelectorAll('button')].forEach(b=>{if(b.dataset.vgYearBound)return;const year=Number((b.textContent.trim().match(/20\d{2}/)||[])[0]);if(!year)return;b.dataset.vgYearBound='1';b.addEventListener('click',()=>{if(internalYearClick)return;if(year!==2020&&year!==2024){selectedMunicipalYear=null;setTimeout(()=>setVisualYear(box,year),0)}},true)});if(box.querySelector('[data-vg-year="2024"]'))return;const template=box.querySelector('button');if(!template)return;const make=(year,beforeYear)=>{const b=template.cloneNode(true);b.dataset.vgYear=String(year);b.dataset.vgYearBound='1';b.disabled=false;b.textContent=String(year);b.title=`Ver candidatos de ${year}`;b.className=template.className.replace('cursor-not-allowed','').replace('line-through','');b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();selectedMunicipalYear=year;const y26=[...box.querySelectorAll('button')].find(x=>x.textContent.trim().startsWith('2026'));if(y26){internalYearClick=true;y26.click();internalYearClick=false}setTimeout(()=>setVisualYear(box,year),25)});const before=[...box.querySelectorAll('button')].find(x=>x.textContent.trim().startsWith(String(beforeYear)));box.insertBefore(b,before||null)};make(2024,2022);make(2020,2018)}
 const observer=new MutationObserver(()=>{installYearButtons();document.querySelectorAll('option').forEach(o=>{if(o.textContent==='PREFEITO')o.textContent='Prefeito';if(o.textContent==='VEREADOR')o.textContent='Vereador'})});
 addEventListener('DOMContentLoaded',()=>{observer.observe(document.body,{childList:true,subtree:true});installYearButtons()});
})();
</script>
