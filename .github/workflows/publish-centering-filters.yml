name: Publicar centralização e filtros
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: github.event.head_commit.message == 'Publicar centralização dos números e filtros'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Baixar build validado
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-14b0-820e-bc60-4da6b9f0966c/raw?se=2026-08-17T13%3A09%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=3e33e35c-132d-50ef-8cde-f60d328adbba&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T09%3A36%3A08Z&ske=2026-08-18T09%3A36%3A08Z&sks=b&skv=2026-02-06&sig=Z1EXOxXajNsEQ4kUlCnsZtJ1XUo8EQOQitlixySU5H0%3D'
        run: |
          curl -fL "$ARTIFACT_URL" -o /tmp/site.zip
          rm -rf /tmp/site && mkdir -p /tmp/site
          unzip -q /tmp/site.zip -d /tmp/site
          test -f /tmp/site/index.html
      - name: Publicar site
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/site/. .
          cp index.html 404.html
          touch .nojekyll
          git config user.name "Voto Guia Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Atualizar números e painel de filtros" || exit 0
          git push origin HEAD:gh-pages
