name: Publicar correção de exportação
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: github.event.head_commit.message == 'Publicar correção de centralização na exportação'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Baixar build validado
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-123c-820e-9d9e-850019dfb854/raw?se=2026-08-17T13%3A30%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=2cbf4691-7374-5612-b131-156ce9cf6d1e&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T10%3A32%3A20Z&ske=2026-08-18T10%3A32%3A20Z&sks=b&skv=2026-02-06&sig=AAqn%2B/weTe6kRnbqCq9cePoaa4NxOHgzw%2BOA8D0OGA0%3D'
        run: |
          curl -fL "$ARTIFACT_URL" -o /tmp/site.zip
          rm -rf /tmp/site && mkdir -p /tmp/site
          unzip -q /tmp/site.zip -d /tmp/site
          test -f /tmp/site/index.html
      - name: Publicar site
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/site/. .
          cp index.html 404.html
          touch .nojekyll
          git config user.name "Voto Guia Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Corrigir números na exportação" || exit 0
          git push origin HEAD:gh-pages
