name: Publicar correções do santinho
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: github.event.head_commit.message == 'Publicar correções de compartilhamento e números'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Baixar build validado
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-51a0-820e-8f8b-56556b462009/raw?se=2026-08-17T12%3A47%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=6b6ef287-4287-5f21-91e2-1a92caa0b83d&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T12%3A16%3A59Z&ske=2026-08-18T12%3A16%3A59Z&sks=b&skv=2026-02-06&sig=MYh4k4BJbEJd8cbiB1asDSvltDRheBopQUNZJhDVJwY%3D'
        run: |
          curl -fL "$ARTIFACT_URL" -o /tmp/site.zip
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/site.zip -d /tmp/site
          test -f /tmp/site/index.html
          test -f /tmp/site/404.html

      - name: Publicar site
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/site/. .
          touch .nojekyll
          git config user.name "Voto Guia Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Atualizar santinho e compartilhamento" || exit 0
          git push origin HEAD:gh-pages
