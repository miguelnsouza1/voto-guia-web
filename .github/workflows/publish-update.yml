name: Publicar atualização do Voto Guia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar build validado
        run: |
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-afc0-820e-9605-9633d4de1c00/raw?se=2026-08-17T10%3A26%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=3bf02c28-14d3-545e-82db-e378c222d2c8&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-16T20%3A49%3A16Z&ske=2026-08-17T20%3A49%3A16Z&sks=b&skv=2026-02-06&sig=l1PvUWBCAszcGNW2O0yh/qrxccGl/BmyRFZLrqc254U%3D' -o /tmp/voto-guia-dist.zip
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/voto-guia-dist.zip -d /tmp/site
          cp /tmp/site/index.html /tmp/site/404.html
          touch /tmp/site/.nojekyll

      - name: Publicar somente o site compilado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan gh-pages-new
          git rm -rf .
          cp -a /tmp/site/. .
          git add -A
          git commit -m 'Atualizar ficha filtros e santinho'
          git branch -M gh-pages
          git push --force origin gh-pages
