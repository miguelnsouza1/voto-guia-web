name: Publicar build validado
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e publicar build
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-2d3c-820e-b615-4192440e49e6/raw?se=2026-08-17T17%3A30%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=a1f474bf-cdb7-5dfd-a691-15062f1d914f&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T13%3A53%3A45Z&ske=2026-08-18T13%3A53%3A45Z&sks=b&skv=2026-02-06&sig=wc6yXtA16dfBZfRfjnh8ohw1IIrOsQUqtVdXZhCQyUQ%3D' -o /tmp/voto-guia-dist.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          unzip -q -o /tmp/voto-guia-dist.zip -d .
          touch .nojekyll
          rm -f .github/workflows/publish-dist-once.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publicar Voto Guia 2022 com fotos e resultados'
          git push
