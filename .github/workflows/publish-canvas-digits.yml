name: Publicar exportação final do santinho
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: github.event.head_commit.message == 'Publicar exportação com números desenhados no canvas'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Baixar build compilado
        run: |
          mkdir -p assets
          curl -fL 'https://raw.githubusercontent.com/miguelnsouza1/voto-guia/compiled-web/index.html?token=BWE67QCNC7TIRKHZMQPCH4DKQMJMO' -o index.html
          cp index.html 404.html
          curl -fL 'https://raw.githubusercontent.com/miguelnsouza1/voto-guia/compiled-web/assets/html2canvas.esm-QH1iLAAe.js?token=BWE67QDDXHPJS7DZL2DY2Q3KQMJNE' -o assets/html2canvas.esm-QH1iLAAe.js
          curl -fL 'https://raw.githubusercontent.com/miguelnsouza1/voto-guia/compiled-web/assets/index-ChjiIZsM.css?token=BWE67QDU7NCTKCSO6GXZRITKQMJNE' -o assets/index-ChjiIZsM.css
          curl -fL 'https://raw.githubusercontent.com/miguelnsouza1/voto-guia/compiled-web/assets/index-Dwcmhc0y.js?token=BWE67QC3GMGECFQHV7XGP63KQMJNE' -o assets/index-Dwcmhc0y.js
          curl -fL 'https://raw.githubusercontent.com/miguelnsouza1/voto-guia/compiled-web/assets/index.es-Df1hLGUt.js?token=BWE67QFWBX5553PF2LZ43YLKQMJNE' -o assets/index.es-Df1hLGUt.js
          curl -fL 'https://raw.githubusercontent.com/miguelnsouza1/voto-guia/compiled-web/assets/jspdf.es.min-BMX5zkt9.js?token=BWE67QHLD2HPSCDF2FGTYNTKQMJNE' -o assets/jspdf.es.min-BMX5zkt9.js
          curl -fL 'https://raw.githubusercontent.com/miguelnsouza1/voto-guia/compiled-web/assets/purify.es-DP5U8-sc.js?token=BWE67QFAFC7WR73WP5GPHO3KQMJNE' -o assets/purify.es-DP5U8-sc.js
          touch .nojekyll
      - name: Publicar gh-pages
        run: |
          git config user.name "Voto Guia Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Publicar centralização real dos números exportados" || exit 0
          git push origin HEAD:gh-pages
