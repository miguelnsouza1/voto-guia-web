name: Publicar artefato final validado
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: github.event.head_commit.message == 'Publicar artefato final validado'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Baixar artefato validado
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-5bd4-820e-8fd6-5aca7c1106aa/raw?se=2026-08-17T14%3A06%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=440aa027-bbc7-5840-8d50-e19f02205c66&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T10%3A32%3A19Z&ske=2026-08-18T10%3A32%3A19Z&sks=b&skv=2026-02-06&sig=JJMWZRKRvdh4NHnrPZqN5TukWNrBjjkamhQBhQ96EOI%3D'
        run: |
          curl -fL "$ARTIFACT_URL" -o /tmp/site.zip
          rm -rf /tmp/site && mkdir -p /tmp/site
          unzip -q /tmp/site.zip -d /tmp/site
          test -f /tmp/site/index.html
      - name: Publicar site
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/site/. .
          cp index.html 404.html
          touch .nojekyll
          git config user.name "Voto Guia Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Publicar números centralizados por canvas" || exit 0
          git push origin HEAD:gh-pages
