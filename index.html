<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#808080" />
    <meta name="description" content="Voto Guia — candidatos, bens, trajetória e resultados eleitorais com dados públicos do TSE." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Voto Guia" />
    <link rel="manifest" href="/voto-guia-web/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/voto-guia-web/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/voto-guia-web/icons/favicon-32.png" />
    <title>Voto Guia</title>
    <script>
      (() => {
        let selectedMunicipalYear = null;
        let internalYearClick = false;
        const originalFetch = window.fetch.bind(window);

        window.fetch = (input, init = {}) => {
          try {
            let url = typeof input === 'string' ? input : input?.url || '';

            if (url.includes('/rest/v1/rpc/candidate_filter_options') && selectedMunicipalYear) {
              const body = init.body ? JSON.parse(init.body) : {};
              body.p_year = selectedMunicipalYear;
              init = { ...init, body: JSON.stringify(body) };
            }

            if (url.includes('/rest/v1/candidate_catalog_public')) {
              const parsed = new URL(url, window.location.origin);
              if (selectedMunicipalYear) {
                parsed.searchParams.set('election_year', `eq.${selectedMunicipalYear}`);
                const office = parsed.searchParams.get('office_name') || '';
                if (!office || office.startsWith('in.(') || !['PREFEITO','VEREADOR'].includes(office.replace('eq.',''))) {
                  parsed.searchParams.set('office_name', 'in.(PREFEITO,VEREADOR)');
                }
                url = parsed.toString();
                input = typeof input === 'string' ? url : new Request(url, input);
              }

              const headers = new Headers(init.headers || (typeof input !== 'string' ? input?.headers : undefined));
              const prefer = headers.get('Prefer');
              if (prefer && /count=exact/i.test(prefer)) {
                headers.set('Prefer', prefer.replace(/count=exact/ig, 'count=planned'));
                init = { ...init, headers };
              }
            }
          } catch (_) {}
          return originalFetch(input, init);
        };

        function setVisualYear(box, year) {
          box.querySelectorAll('button').forEach((b) => {
            b.classList.remove('border-neutral-800','bg-neutral-800','text-white');
            b.classList.add('border-neutral-200','bg-white','text-neutral-700');
          });
          const active = [...box.querySelectorAll('button')].find((b) => b.textContent.trim().startsWith(String(year)));
          if (active) {
            active.classList.remove('border-neutral-200','bg-white','text-neutral-700');
            active.classList.add('border-neutral-800','bg-neutral-800','text-white');
          }
          document.querySelectorAll('h1').forEach((h) => {
            if (/^Candidatos\s+20\d{2}$/.test(h.textContent.trim())) h.textContent = `Candidatos ${year}`;
          });
        }

        function installYearButtons() {
          const label = [...document.querySelectorAll('div')].find(el => el.textContent?.trim() === 'Ano da eleição');
          if (!label) return;
          const box = label.parentElement?.querySelector('.flex.flex-wrap.gap-2');
          if (!box) return;

          [...box.querySelectorAll('button')].forEach((b) => {
            if (b.dataset.vgYearBound) return;
            const txt = b.textContent.trim();
            const year = Number((txt.match(/20\d{2}/) || [])[0]);
            if (!year) return;
            b.dataset.vgYearBound = '1';
            b.addEventListener('click', () => {
              if (internalYearClick) return;
              if (year !== 2020 && year !== 2024) {
                selectedMunicipalYear = null;
                setTimeout(() => setVisualYear(box, year), 0);
              }
            }, true);
          });

          if (box.querySelector('[data-vg-year="2024"]')) return;
          const template = box.querySelector('button');
          if (!template) return;

          const make = (year, beforeYear) => {
            const b = template.cloneNode(true);
            b.dataset.vgYear = String(year);
            b.dataset.vgYearBound = '1';
            b.disabled = false;
            b.textContent = String(year);
            b.title = `Ver candidatos de ${year}`;
            b.className = template.className.replace('cursor-not-allowed','').replace('line-through','');
            b.addEventListener('click', (event) => {
              event.preventDefault();
              event.stopPropagation();
              selectedMunicipalYear = year;
              const year2026 = [...box.querySelectorAll('button')].find(x => x.textContent.trim().startsWith('2026'));
              if (year2026) {
                internalYearClick = true;
                year2026.click();
                internalYearClick = false;
              }
              setTimeout(() => setVisualYear(box, year), 25);
            });
            const before = [...box.querySelectorAll('button')].find(x => x.textContent.trim().startsWith(String(beforeYear)));
            box.insertBefore(b, before || null);
          };

          make(2024, 2022);
          make(2020, 2018);
        }

        const observer = new MutationObserver(() => {
          installYearButtons();
          document.querySelectorAll('option').forEach((option) => {
            if (option.textContent === 'PREFEITO') option.textContent = 'Prefeito';
            if (option.textContent === 'VEREADOR') option.textContent = 'Vereador';
          });
        });
        window.addEventListener('DOMContentLoaded', () => {
          observer.observe(document.body, { childList: true, subtree: true });
          installYearButtons();
        });
      })();
    </script>
    <script type="module" crossorigin src="/voto-guia-web/assets/index-CGVnDrv4.js"></script>
    <link rel="stylesheet" crossorigin href="/voto-guia-web/assets/index-BzVq6yl3.css">
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ative o JavaScript para usar o Voto Guia.</noscript>
  </body>
</html>
